<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT URL Sender</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>ChatGPT URL Sender</h1>
    
    <div class="section">
      <h2>モデルを選択</h2>
      <select id="modelSelect" class="model-select">
        <option value="gpt-4o">GPT-4o</option>
        <option value="o3">o3</option>
        <option value="o4-mini">o4-mini</option>
        <option value="o4-mini-high">o4-mini-high</option>
      </select>
    </div>
    
    <div class="section">
      <h2>プロンプトを選択</h2>
      <div class="radio-group">
        <label>
          <input type="radio" name="prompt" value="default" checked>
          デフォルト（要約）
        </label>
        <label>
          <input type="radio" name="prompt" value="custom">
          カスタム
        </label>
      </div>
    </div>

    <div class="section" id="customPromptSection" style="display: none;">
      <h2>カスタムプロンプト</h2>
      <textarea id="customPrompt" placeholder="カスタムプロンプトを入力..."></textarea>
    </div>

    <div class="section">
      <button id="sendButton" class="send-button">ChatGPTに送信</button>
    </div>

    <div id="status" class="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
